<h1>Dashboard - Your Rules</h1>
<a href="accounts.html">Switch Account</a>
<div class="table-container">
<table id="rules-table">
    <thead>
    <tr>
        <th>Name</th><th>Community Regex</th><th>Package Regex</th>
        <th>Version Regex</th><th>Description Regex</th><th>General Regex</th>
        <th>Webhook URL</th><th>Actions</th>
    </tr>
    </thead>
    <tbody id="rules-body"></tbody>
</table>
</div>

<h3>Add New Rule</h3>
<input placeholder="Name" id="rule-name">
<input placeholder="Community Regex" id="community-regex">
<input placeholder="Package Regex" id="package-regex">
<input placeholder="Version Regex" id="version-regex">
<input placeholder="Description Regex" id="description-regex">
<input placeholder="General Regex" id="general-regex">
<input placeholder="Webhook URL" id="rule-url">
<button onclick="addRule()">Add Rule</button>
<script src="js/main.js"></script>
