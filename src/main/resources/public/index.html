<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thunderstore Rules WebUI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input, button { padding: 5px; margin: 5px; }
        #rules-table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        #rules-table th, #rules-table td { border: 1px solid #ccc; padding: 5px; text-align: left; }
    </style>
</head>
<body>
<h1>Thunderstore Rules WebUI</h1>

<div id="auth">
    <h2>Login / Register</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
</div>

<div id="rules-section" style="display:none;">
    <h2>Your Rules</h2>
    <table id="rules-table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Community Regex</th>
            <th>Package Regex</th>
            <th>Version Regex</th>
            <th>Description Regex</th>
            <th>General Regex</th>
            <th>Webhook URL</th>
        </tr>
        </thead>
        <tbody id="rules-body"></tbody>
    </table>

    <h3>Add New Rule</h3>
    <input placeholder="Name" id="rule-name">
    <input placeholder="Community Regex" id="community-regex">
    <input placeholder="Package Regex" id="package-regex">
    <input placeholder="Version Regex" id="version-regex">
    <input placeholder="Description Regex" id="description-regex">
    <input placeholder="General Regex" id="general-regex">
    <input placeholder="Webhook URL" id="rule-url">
    <button onclick="addRule()">Add Rule</button>
</div>

<script>
    let token = null;

    function register() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        fetch("/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({username, password})
        }).then(res => res.text()).then(alert);
    }

    function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({username, password})
        })
            .then(res => res.json())
            .then(data => {
                token = data.token;
                document.getElementById("auth").style.display = "none";
                document.getElementById("rules-section").style.display = "block";
                loadRules();
            })
            .catch(err => {
                alert("Login failed")
                console.log(err)
            });
    }

    function loadRules() {
        fetch("/rules", {
            headers: { "Authorization": token }
        })
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("rules-body");
                tbody.innerHTML = "";
                data.forEach(rule => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
        <td><input value="${rule.name || ""}" id="name-${rule.id}"></td>
        <td><input value="${rule.communityRegex || ""}" id="community-${rule.id}"></td>
        <td><input value="${rule.packageRegex || ""}" id="package-${rule.id}"></td>
        <td><input value="${rule.versionRegex || ""}" id="version-${rule.id}"></td>
        <td><input value="${rule.descriptionRegex || ""}" id="desc-${rule.id}"></td>
        <td><input value="${rule.generalRegex || ""}" id="general-${rule.id}"></td>
        <td><input value="${rule.url || ""}" id="url-${rule.id}"></td>
        <td>
            <button onclick="updateRule(${rule.id})">Save</button>
            <button onclick="deleteRule(${rule.id})">Delete</button>
        </td>
    `;
                    tbody.appendChild(row);
                });

            });
    }

    function updateRule(id) {
        const rule = {
            name: document.getElementById(`name-${id}`).value,
            communityRegex: document.getElementById(`community-${id}`).value,
            packageRegex: document.getElementById(`package-${id}`).value,
            versionRegex: document.getElementById(`version-${id}`).value,
            descriptionRegex: document.getElementById(`desc-${id}`).value,
            generalRegex: document.getElementById(`general-${id}`).value,
            url: document.getElementById(`url-${id}`).value
        };

        fetch(`/rules/${id}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": token
            },
            body: JSON.stringify(rule)
        }).then(res => {
            if(res.status === 200) {
                alert("Rule updated");
                loadRules();
            } else {
                res.text().then(alert);
            }
        });
    }

    function deleteRule(id) {
        if(!confirm("Are you sure you want to delete this rule?")) return;

        fetch(`/rules/${id}`, {
            method: "DELETE",
            headers: { "Authorization": token }
        }).then(res => {
            if(res.status === 200) {
                alert("Rule deleted");
                loadRules();
            } else {
                res.text().then(alert);
            }
        });
    }


    function addRule() {
        const rule = {
            name: document.getElementById("rule-name").value,
            communityRegex: document.getElementById("community-regex").value,
            packageRegex: document.getElementById("package-regex").value,
            versionRegex: document.getElementById("version-regex").value,
            descriptionRegex: document.getElementById("description-regex").value,
            generalRegex: document.getElementById("general-regex").value,
            url: document.getElementById("rule-url").value
        };

        fetch("/rules", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": token
            },
            body: JSON.stringify(rule)
        }).then(res => {
            if(res.status === 201) {
                loadRules();
                alert("Rule added!");
            } else {
                res.text().then(alert);
            }
        });
    }
</script>
</body>
</html>
